# Model identity and serving configuration (prereg §10, §14 fields).
# Values here are FROZEN at the protocol-freeze tag; nothing may change after it.

# Verified request/response contract for the ledger (vLLM 0.17.0, both models):
#   request : {"return_token_ids": true, "seed": <seed(i,s)>, "temperature": 0.6,
#              "max_tokens": 4096, "chat_template_kwargs": {"enable_thinking": false}}
#   output token ids : choices[0].token_ids   (list; includes the terminal EOS)
#   input token count: usage.prompt_tokens    (prompt_token_ids also available)
#   eos vs censored  : choices[0].finish_reason  ("stop" -> eos, "length" -> censored)
# n_i (observed output length, §5.2) := len(choices[0].token_ids) == completion_tokens,
# i.e. the terminal EOS IS counted, matching what a host would bill — the dollar
# frame prices output tokens, so billing semantics govern.
# NOTE: do NOT reconstruct token boundaries by detokenizing then retokenizing the
# text; that is not guaranteed to be identity and would corrupt prefix definitions.

shared:
  max_output_tokens: 4096          # prereg §4 generation cap
  temperature: 0.6                 # prereg §4
  k_samples_per_item: 8            # prereg §4 (fixed unconditionally)
  dtype: bfloat16                  # prereg §10: bf16, no quantization
  quantization: none

  # EOS-vs-censored determination (prereg §4/§5.2). The `eos` ledger flag
  # distinguishes a completed trace from one truncated at the 4096 cap, and it
  # drives both the constant-prefix rule (§4) and the censoring semantics of
  # the dollar frame (§5.2).
  #
  # RULE: eos MUST be derived from the engine's finish_reason
  #   finish_reason == "stop"   -> eos = true   (completed)
  #   finish_reason == "length" -> eos = false  (censored at cap)
  # It must NOT be derived by comparing the final token id against a single
  # EOS constant: Llama-3.1-Instruct has THREE terminators (see below) and the
  # usual one in practice is 128009 (<|eot_id|>), not 128001. A single-constant
  # check would misclassify nearly every completed trace as censored.

models:

  llama_3_1_8b_instruct:
    role: secondary analysis (prereg §3 — no confirmatory claims)
    status: SERVED — identity confirmed
    hf_repo: meta-llama/Meta-Llama-3.1-8B-Instruct
    hf_repo_renamed_upstream_to: meta-llama/Llama-3.1-8B-Instruct   # same weights/tokenizer
    revision: 07eb05b21d191a58c577b4a45982fe0c049d0693
    served_path: REDACTED (internal mount; model identified by hf_repo + revision)
    endpoint: http://[::1]:9001    # port 9001 answers on both IPv4 and IPv6
    engine: vLLM
    engine_version: 0.17.0
    architecture: LlamaForCausalLM
    torch_dtype: bfloat16          # confirmed from served config.json
    vocab_size: 128256
    max_position_embeddings: 131072
    max_model_len_served: 131072
    bos_token_id: 128000
    eos_token_ids: [128001, 128008, 128009]   # <|end_of_text|>, <|eom_id|>, <|eot_id|>
    transformers_version_at_export: 4.42.3

  qwen3_8b:
    role: CONFIRMATORY PRIMARY (prereg §3 — all confirmatory hypotheses)
    status: SERVED — identity and thinking-mode suppression verified 2026-07-24
    hf_repo: Qwen/Qwen3-8B          # POST-TRAINED model. NOT Qwen/Qwen3-8B-Base.
    # Distinguishing check (fetched from HF config.json 2026-07-24):
    #   Qwen/Qwen3-8B       eos_token_id 151645 (<|im_end|>)    <- post-trained, ChatML
    #   Qwen/Qwen3-8B-Base  eos_token_id 151643 (<|endoftext|>) <- raw pretrained, DO NOT USE
    # All four arms are prompt-level policies (§4) that depend on instruction
    # following (trace language, '#### <number>' format). A raw base model
    # would collapse compliance and parse rates and make the arms
    # indistinguishable, measuring nothing.
    revision: 2069b3fae1114555f3c020c81410e51fa0f656f2
    served_path: REDACTED (internal mount; model identified by hf_repo + revision)
    endpoint: http://[::1]:9002
    engine: vLLM
    engine_version: 0.17.0
    max_model_len_served: 40960
    torch_dtype: bfloat16           # confirmed from HF config.json
    required_serving_flags:
      enable_thinking: false        # prereg §10 — CRITICAL
      # Qwen3 is a hybrid reasoning model that by default emits a separate
      # <think>...</think> channel. The protocol requires all reasoning in the
      # visible, budgeted channel, because budgets are defined as token
      # prefixes of the visible trace (§4). Reasoning in a hidden channel would
      # make every budget number measure the wrong thing.
      # VERIFIED EMPIRICALLY 2026-07-24 (not merely trusted from the flag):
      #   default request      -> content opens with "<think>", consumed all 220
      #                           max_tokens on reasoning, finish_reason "length",
      #                           NO answer produced at all
      #   enable_thinking=false -> no "<think>", direct answer in 85 tokens,
      #                           finish_reason "stop"
      # Also checked: message.reasoning_content is ABSENT in both cases, i.e. no
      # vLLM reasoning-parser is configured on this deployment, so thinking (when
      # on) is inline and visible rather than a hidden channel. It is disabled
      # regardless, since it would consume the budget before any answer and would
      # almost certainly reason in English, destroying NATIVE-arm trace-language
      # compliance (§6).
      # Transport: pass chat_template_kwargs={"enable_thinking": false} on every
      # /v1/chat/completions request. There is no server-side default to rely on.
    min_max_model_len: 8192         # prompt (short) + 4096 output cap
    # Confirmed from HF config.json (2026-07-24):
    architecture: Qwen3ForCausalLM
    vocab_size: 151936
    num_hidden_layers: 36
    max_position_embeddings: 40960  # ample for the 8192 requirement
    bos_token_id: 151643
    eos_token_ids: [151645]         # single terminator, unlike Llama's three;
                                    # the finish_reason rule above still applies
