[project]
name = "language-research"
version = "0.1.0"
description = "Harness for matched-budget language-strategy research"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[dependency-groups]
test = [
    "pytest",
]

[project.optional-dependencies]
# generation = ["vllm==<pin>", "transformers==<pin>"]
language-id = [
    "fasttext-wheel",
    "huggingface_hub",
    "numpy<2",
]
translation-eval = [
    "huggingface_hub>=0.30,<2",
    "sacrebleu>=2.5,<3",
    "unbabel-comet>=2.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
